[project]
name = "classall-bot"
version = "0.1.0"
description = "Dual-channel shipping document classification, extraction, validation, and human review"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.118.0",
    "google-api-python-client>=2.181.0",
    "google-auth>=2.40.0",
    "google-auth-oauthlib>=1.2.2",
    "google-cloud-firestore>=2.21.0",
    "google-cloud-pubsub>=2.31.0",
    "google-cloud-secret-manager>=2.24.0",
    "google-cloud-storage>=3.3.0",
    "google-genai>=1.38.0",
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.10.0",
    "pypdf>=6.0.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.1.0",
    "ruff>=0.13.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "E402", "B904", "UP042"]
